services:
  - type: web
    name: bhoomimitra-ai
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: FLASK_SECRET_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.6-flash