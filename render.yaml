services:
  - type: web
    name: bhoomimitra-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false

      - key: OPENROUTER_MODEL
        value: openrouter/free

      - key: FLASK_SECRET_KEY
        sync: false